<svg xmlns="http://www.w3.org/2000/svg" width="800" height="950" viewBox="0 0 800 950" role="img" aria-labelledby="title desc">
<title id="title">ABCDE-modellen</title><desc id="desc">Fem deler av en situasjon: hendelse, tolkning, reaksjon, undersøkelse og mer holdbar forståelse med handlingsvalg. Ikke en enkel årsakskjede.</desc>
<rect width="800" height="950" fill="#fff"/>
<g fill="#242424" font-family="Arial, sans-serif">
<text x="40" y="48" font-size="24" font-weight="600" >Ræder&amp;</text><text x="760" y="48" font-size="22" font-weight="400" text-anchor="end">raederog.no</text>
<text x="40" y="118" font-size="38" font-weight="600" >ABCDE-modellen</text>
<path d="M40 148 H760" stroke="#dcdcdc"/>
<circle cx="72" cy="203" r="31" fill="#ffa6a6"/>
<text x="72" y="213" font-size="30" font-weight="600" text-anchor="middle">A</text>
<text x="124" y="206" font-size="30" font-weight="600" >Hendelsen</text>
<text x="124" y="250" font-size="26" font-weight="400" >Hva skjedde?</text>
<path d="M40 278 H760" stroke="#dcdcdc"/>
<circle cx="72" cy="326" r="31" fill="#ffa6a6"/>
<text x="72" y="336" font-size="30" font-weight="600" text-anchor="middle">B</text>
<text x="124" y="329" font-size="30" font-weight="600" >Tolkningen</text>
<text x="124" y="373" font-size="26" font-weight="400" >Hva tenkte eller antok du?</text>
<path d="M40 401 H760" stroke="#dcdcdc"/>
<circle cx="72" cy="449" r="31" fill="#ffa6a6"/>
<text x="72" y="459" font-size="30" font-weight="600" text-anchor="middle">C</text>
<text x="124" y="452" font-size="30" font-weight="600" >Reaksjonen</text>
<text x="124" y="496" font-size="26" font-weight="400" >Hva kjente og gjorde du?</text>
<path d="M40 524 H760" stroke="#dcdcdc"/>
<circle cx="72" cy="572" r="31" fill="#ffa6a6"/>
<text x="72" y="582" font-size="30" font-weight="600" text-anchor="middle">D</text>
<text x="124" y="575" font-size="30" font-weight="600" >Undersøk tolkningen</text>
<text x="124" y="619" font-size="26" font-weight="400" >Hva støtter og utfordrer den?</text>
<path d="M40 647 H760" stroke="#dcdcdc"/>
<circle cx="72" cy="695" r="31" fill="#ffa6a6"/>
<text x="72" y="705" font-size="30" font-weight="600" text-anchor="middle">E</text>
<text x="124" y="698" font-size="30" font-weight="600" >Forståelse og handling</text>
<text x="124" y="742" font-size="26" font-weight="400" >Hva er mer presist? Hva vil du gjøre?</text>
<path d="M40 770 H760" stroke="#dcdcdc"/><text x="40" y="846" font-size="24" font-weight="400" >Reaksjoner påvirkes også av situasjon og rammer.</text>
<text x="40" y="882" font-size="24" font-weight="400" >Norsk tilpasning av ABCDE, med bakgrunn i REBT.</text>
</g></svg>
