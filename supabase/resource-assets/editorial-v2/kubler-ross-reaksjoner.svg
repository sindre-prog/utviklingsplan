<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1040" viewBox="0 0 800 1040" role="img" aria-labelledby="title desc">
<title id="title">Kübler-Ross: mulige reaksjoner</title><desc id="desc">Fem mulige reaksjoner uten tidsakse, kurve eller fast rekkefølge. Arbeidslivsanvendelsen er en redaksjonell tilpasning, ikke den opprinnelige modellen.</desc>
<rect width="800" height="1040" fill="#fff"/>
<g fill="#242424" font-family="Arial, sans-serif">
<text x="40" y="48" font-size="24" font-weight="600" >Ræder&amp;</text><text x="760" y="48" font-size="22" font-weight="400" text-anchor="end">raederog.no</text>
<text x="40" y="118" font-size="38" font-weight="600" >Reaksjoner i endring</text>
<path d="M40 148 H760" stroke="#dcdcdc"/>
<text x="40" y="196" font-size="26" font-weight="400" >Mulige reaksjoner, ikke faste trinn.</text>
<text x="40" y="234" font-size="26" font-weight="400" >De kan overlappe, komme tilbake eller utebli.</text><text x="40" y="311" font-size="31" font-weight="600" >Fornektelse</text><text x="40" y="354" font-size="27" font-weight="400" >Hva er vanskelig å ta inn?</text><path d="M40 383 H760" stroke="#dcdcdc"/>
<text x="40" y="421" font-size="31" font-weight="600" >Sinne</text><text x="40" y="464" font-size="27" font-weight="400" >Hva oppleves urimelig eller truet?</text><path d="M40 493 H760" stroke="#dcdcdc"/>
<text x="40" y="531" font-size="31" font-weight="600" >Forhandling</text><text x="40" y="574" font-size="27" font-weight="400" >Hva ønsker personen å påvirke?</text><path d="M40 603 H760" stroke="#dcdcdc"/>
<text x="40" y="641" font-size="31" font-weight="600" >Nedstemthet</text><text x="40" y="684" font-size="27" font-weight="400" >Hva oppleves som et tap?</text><path d="M40 713 H760" stroke="#dcdcdc"/>
<text x="40" y="751" font-size="31" font-weight="600" >Aksept</text><text x="40" y="794" font-size="27" font-weight="400" >Hva trengs for å håndtere situasjonen?</text><path d="M40 823 H760" stroke="#dcdcdc"/><text x="40" y="902" font-size="24" font-weight="400" >Tilpasset lederrefleksjon med bakgrunn i</text>
<text x="40" y="938" font-size="24" font-weight="400" >On Death and Dying (Kübler-Ross, 1969).</text>
<text x="40" y="974" font-size="24" font-weight="400" >Ikke en måling av fremdrift eller en diagnose.</text>
</g></svg>
