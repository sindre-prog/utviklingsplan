<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc">
<title id="title">Pareto-prinsippet</title><desc id="desc">Illustrativ 80/20-fordeling, uttrykkelig merket som prinsippskisse. Tallene er ikke data eller et krav til prioritering.</desc>
<rect width="800" height="760" fill="#fff"/>
<g fill="#242424" font-family="Arial, sans-serif">
<text x="40" y="48" font-size="24" font-weight="600" >Ræder&amp;</text><text x="760" y="48" font-size="22" font-weight="400" text-anchor="end">raederog.no</text>
<text x="40" y="118" font-size="38" font-weight="600" >Pareto-prinsippet</text>
<path d="M40 148 H760" stroke="#dcdcdc"/>
<text x="40" y="198" font-size="24" font-weight="400" >PRINSIPPSKISSE, IKKE MÅLTE RESULTATER</text><text x="220" y="277" font-size="30" font-weight="600" text-anchor="middle">Innsats</text><text x="580" y="277" font-size="30" font-weight="600" text-anchor="middle">Resultat</text><rect x="120" y="310" width="200" height="280" fill="#eee"/><rect x="120" y="534" width="200" height="56" fill="#ffa6a6"/>
<rect x="480" y="310" width="200" height="280" fill="#eee"/><rect x="480" y="366" width="200" height="224" fill="#ffa6a6"/>
<text x="220" y="489" font-size="32" font-weight="600" text-anchor="middle">80</text><text x="220" y="573" font-size="32" font-weight="600" text-anchor="middle">20</text>
<text x="580" y="350" font-size="32" font-weight="600" text-anchor="middle">20</text><text x="580" y="489" font-size="32" font-weight="600" text-anchor="middle">80</text>
<text x="40" y="652" font-size="26" font-weight="400" >80/20 er et bilde på ulik betydning, ikke en fasit.</text>
<text x="40" y="688" font-size="26" font-weight="400" >Undersøk verdien i din situasjon. Ta hensyn til</text>
<text x="40" y="724" font-size="26" font-weight="400" >ansvar, risiko og nødvendig støttearbeid.</text>
</g></svg>
